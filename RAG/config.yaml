embed: embeddinggemma
rewrite: qwen3.5:0.8b
ollama_host: http://127.0.0.1:11434
rewrite_enabled: true
hyde: true

store_dir: indexes
docs_path: ../docs

child_tokens: 256
parent_tokens: 1024
overlap_tokens: 32
chunk: parent_child

# Ingestion : textes par requête /api/embed, et requêtes simultanées.
# embed_workers > 1 n'aide que si Ollama tourne avec OLLAMA_NUM_PARALLEL > 1.
embed_batch: 16
embed_workers: 1

# Fusion RRF : poids de chaque liste dense (Gemma) et lexicale (BM25).
# Monter bm25_weight (ex. 1.5) aide sur un corpus riche en termes exacts
# (gènes, acronymes, références d'articles).
dense_weight: 1.0
bm25_weight: 1.0
rrf_k: 60

collections:
  default:
    path: ../docs
    chunk: parent_child
